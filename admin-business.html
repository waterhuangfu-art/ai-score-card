<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台 · 从经验到生意共创卡</title>
  <script src="./api-config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #eef8ff;
      --bg-2: #fbfdff;
      --panel: rgba(255, 255, 255, 0.94);
      --line: #d5eaff;
      --text: #152136;
      --muted: #63748e;
      --blue: #1798ff;
      --blue-2: #5fd6ff;
      --soft: #f7fbff;
      --shadow: 0 22px 52px rgba(61, 123, 207, 0.14);
    }

    body {
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(95, 214, 255, 0.3), transparent 26%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      padding: 24px 18px 40px;
    }

    .page {
      max-width: 1320px;
      margin: 0 auto;
    }

    .toolbar,
    .stats-grid,
    .table-wrap {
      background: var(--panel);
      border: 1px solid rgba(213, 234, 255, 0.94);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    .toolbar h1 {
      font-size: 20px;
      font-weight: 800;
      flex: 1;
      min-width: 240px;
      letter-spacing: 0;
    }

    .toolbar-copy {
      width: 100%;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin-top: -4px;
    }

    .toolbar input {
      width: 220px;
      max-width: 100%;
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 11px 14px;
      font: inherit;
      outline: none;
    }

    .toolbar input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(23, 152, 255, 0.12);
    }

    .btn,
    .link-btn {
      border-radius: 12px;
      padding: 11px 16px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: 1.5px solid transparent;
      white-space: nowrap;
    }

    .btn {
      background: linear-gradient(135deg, var(--blue), var(--blue-2));
      color: #fff;
      box-shadow: 0 12px 24px rgba(23, 152, 255, 0.18);
    }

    .link-btn {
      background: #fff;
      border-color: var(--line);
      color: var(--blue);
    }

    .badge {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .stat {
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, #fff, var(--soft));
      border: 1px solid var(--line);
    }

    .stat-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .stat-value {
      font-size: 30px;
      line-height: 1.12;
      color: var(--blue);
      font-weight: 800;
      letter-spacing: 0;
    }

    .table-wrap {
      padding: 16px;
      overflow-x: auto;
    }

    .state-box {
      text-align: center;
      padding: 68px 20px;
      color: var(--muted);
      font-size: 15px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid #d8e7fb;
      border-top-color: var(--blue);
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      min-width: 1120px;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--line);
    }

    thead {
      background: var(--soft);
    }

    th {
      text-align: left;
      padding: 12px 14px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #edf3fb;
      vertical-align: top;
      font-size: 14px;
      line-height: 1.6;
    }

    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #fbfdff; }

    .name-link {
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
    }

    .name-link:hover { color: var(--blue); }
    .muted { color: var(--muted); }
    .clip { max-width: 280px; }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #162033;
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
      z-index: 1200;
      box-shadow: 0 16px 40px rgba(15,23,42,0.22);
    }

    .toast.show { display: block; }
    .toast.success { background: #0f8d5b; }
    .toast.error { background: #b42318; }

    @media (max-width: 1024px) {
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      body { padding: 14px 10px 28px; }
      .toolbar, .stats-grid, .table-wrap { border-radius: 16px; }
      .stats-grid { grid-template-columns: 1fr; }
      .toolbar h1 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="toolbar">
      <h1>从经验到生意共创卡 · 后台看板</h1>
      <input id="sessionInput" type="text" placeholder="按场次标签筛选（选填）" />
      <button class="btn" type="button" onclick="loadData()">刷新</button>
      <button class="btn" type="button" onclick="copyTable()">复制表格</button>
      <a class="link-btn" href="./admin.html">后台入口</a>
      <a class="link-btn" href="./index.html">评分卡首页</a>
      <a class="link-btn" href="https://github.com/waterhuangfu-art/ai-score-card/issues?q=is%3Aissue%20label%3Abusiness-workshop-card" target="_blank" rel="noreferrer">GitHub 记录 →</a>
      <div class="badge" id="countBadge">加载中...</div>
      <div class="toolbar-copy">后台读取已提交的共创卡记录。填写人需要在前台点击“提交到后台”，这里才会出现数据。</div>
    </div>

    <div class="stats-grid" id="statsGrid" style="display:none">
      <div class="stat">
        <div class="stat-label">提交人数</div>
        <div class="stat-value" id="totalCount">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">卖流程</div>
        <div class="stat-value" id="flowCount">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">卖工具</div>
        <div class="stat-value" id="toolCount">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">AI放大点最多</div>
        <div class="stat-value" id="topAiMode">—</div>
      </div>
    </div>

    <div class="table-wrap">
      <div class="state-box" id="stateBox"><div class="spinner"></div><br />加载中...</div>
      <table id="dataTable" style="display:none">
        <thead>
          <tr>
            <th>姓名</th>
            <th>场次</th>
            <th>经验资产</th>
            <th>客户问题</th>
            <th>变现切口</th>
            <th>AI放大</th>
            <th>72小时行动</th>
            <th>短板</th>
            <th>提交时间</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = typeof window.resolveScoreCardApiBase === 'function'
      ? window.resolveScoreCardApiBase()
      : window.location.origin;
    let currentRecords = [];

    function esc(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function fmtTime(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function showToast(text, type = '') {
      const el = document.getElementById('toast');
      el.textContent = text;
      el.className = `toast show${type ? ' ' + type : ''}`;
      clearTimeout(el._timer);
      el._timer = setTimeout(() => { el.className = 'toast'; }, 3000);
    }

    function countBy(records, key) {
      return records.reduce((acc, item) => {
        const value = item[key] || '未填写';
        acc[value] = (acc[value] || 0) + 1;
        return acc;
      }, {});
    }

    function topKey(map) {
      const entries = Object.entries(map).sort((a, b) => b[1] - a[1]);
      return entries.length ? entries[0][0] : '-';
    }

    function updateStats(records) {
      const pathCounts = countBy(records, 'monetizationPath');
      const aiCounts = countBy(records, 'aiMode');
      document.getElementById('totalCount').textContent = records.length;
      document.getElementById('flowCount').textContent = pathCounts['卖流程'] || 0;
      document.getElementById('toolCount').textContent = pathCounts['卖工具'] || 0;
      document.getElementById('topAiMode').textContent = topKey(aiCounts);
      document.getElementById('statsGrid').style.display = 'grid';
    }

    function renderTable(records) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = records.map((item) => `
        <tr>
          <td><a class="name-link" href="${esc(item.url)}" target="_blank" rel="noreferrer">${esc(item.name || '未命名')}</a></td>
          <td class="muted">${esc(item.session || '-')}</td>
          <td class="clip">${esc(item.assetOutput || '-')}</td>
          <td class="clip">${esc(item.customerOutput || '-')}</td>
          <td><span class="pill">${esc(item.monetizationPath || '未填写')}</span></td>
          <td><span class="pill">${esc(item.aiMode || '未填写')}</span></td>
          <td class="clip">${esc(item.validationCommitment || '-')}</td>
          <td class="muted">${esc(item.growthGap || '-')}</td>
          <td class="muted">${fmtTime(item.createdAt)}</td>
        </tr>
      `).join('');
    }

    async function loadData() {
      const stateBox = document.getElementById('stateBox');
      const table = document.getElementById('dataTable');
      const session = document.getElementById('sessionInput').value.trim();
      stateBox.style.display = 'block';
      stateBox.innerHTML = '<div class="spinner"></div><br />加载中...';
      table.style.display = 'none';

      try {
        const url = new URL(`${API_BASE}/api/results-business`);
        if (session) url.searchParams.set('session', session);
        const response = await fetch(url.toString());
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '加载失败');

        currentRecords = data.records || [];
        document.getElementById('countBadge').textContent = `${currentRecords.length} 条记录`;
        updateStats(currentRecords);

        if (!currentRecords.length) {
          stateBox.innerHTML = '暂无提交记录。确认前台填写人已经点击“提交到后台”。';
          return;
        }

        renderTable(currentRecords);
        stateBox.style.display = 'none';
        table.style.display = 'table';
      } catch (error) {
        stateBox.innerHTML = esc(error.message || '加载失败');
        document.getElementById('countBadge').textContent = '加载失败';
      }
    }

    async function copyTable() {
      if (!currentRecords.length) {
        showToast('暂无可复制记录。', 'error');
        return;
      }
      const header = ['姓名', '场次', '经验资产', '客户问题', '变现切口', 'AI放大', '72小时行动', '短板', '提交时间'];
      const rows = currentRecords.map((item) => [
        item.name || '',
        item.session || '',
        item.assetOutput || '',
        item.customerOutput || '',
        item.monetizationPath || '',
        item.aiMode || '',
        item.validationCommitment || '',
        item.growthGap || '',
        fmtTime(item.createdAt)
      ]);
      const text = [header, ...rows].map((row) => row.map((cell) => String(cell).replace(/\t/g, ' ')).join('\t')).join('\n');
      await navigator.clipboard.writeText(text);
      showToast('已复制后台表格。', 'success');
    }

    const params = new URLSearchParams(window.location.search);
    const initialSession = params.get('session');
    if (initialSession) {
      document.getElementById('sessionInput').value = initialSession;
    }
    loadData();
  </script>
</body>
</html>
